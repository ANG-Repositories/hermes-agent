name: Vault page targeting
on:
  pull_request:
    paths:
      - 'tools/browser_vault_tool.py'
      - 'tests/tools/test_browser_vault*.py'
      - '.github/workflows/vault-page-target.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --group dev --python 3.14
      - run: uv pip install playwright==1.62.0
      - run: uv run playwright install --with-deps chromium
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --global agent-browser@0.26.0
      - name: Real Chromium and real CLI tool-session regression
        run: |
          uv run --no-sync pytest tests/tools/test_browser_vault.py tests/tools/test_browser_vault_cards.py tests/tools/test_browser_vault_target.py tests/tools/test_browser_vault_cli_target.py -q --tb=short --junitxml=vault-target.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vault-target-results
          path: vault-target.xml
